# Deploy AI RADIO to an isolated preview by default. Production remains an
# explicit workflow_dispatch choice. Every deploy runs the tests first, is
# stamped, read back, and (for preview only) exercised through a disposable
# channel.
#
# This repository is the only source that deploys the station: teakofe's old
# deploy-airadio.yml is retired. Every push to main that changes more than
# prose redeploys staging; production is still only ever dispatched by hand:
#   gh workflow run deploy.yml -f environment=production
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".env.example"
  workflow_dispatch:
    inputs:
      environment:
        description: "staging (default) or production — production is never implicit"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production

# The workflow only reads the repository; Cloudflare credentials come from secrets.
permissions:
  contents: read

# One deploy per target at a time; a newer push waits instead of racing.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # A scoped, account-owned API token issued for this repository alone
      # (Workers Scripts Write and Account Settings Read on the account; Zone
      # Read and Workers Routes Write on akbrd.com), never the Global API Key.
      # Both values are secrets, so the account id is masked in public logs.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: verify the credential before touching anything
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be repository secrets. Nothing was deployed."
            exit 1
          fi
          STATUS=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -r '.result.status')
          if [ "$STATUS" != "active" ]; then
            echo "::error::Cloudflare did not confirm the API token as active (status: $STATUS). Nothing was deployed."
            exit 1
          fi

      - name: refuse an unthrottled surface
        run: npm run airadio:gate

      - name: name the target environment
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            echo "WORKER_NAME=airadio" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV_ARGS=" >> "$GITHUB_ENV"
          else
            echo "WORKER_NAME=airadio-staging" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV_ARGS=--env staging" >> "$GITHUB_ENV"
          fi

      - name: deploy the worker
        run: npx wrangler@4 deploy --config worker/wrangler.toml $WRANGLER_ENV_ARGS --var GIT_SHA:$GITHUB_SHA

      - name: resolve the deployed workers.dev address
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$SUB" ] || [ "$SUB" = "null" ]; then
            echo "::error::could not resolve the workers.dev subdomain"
            exit 1
          fi
          echo "AIRADIO_BASE=https://$WORKER_NAME.$SUB.workers.dev" >> "$GITHUB_ENV"

      - name: read back the deployed build SHA
        run: |
          READBACK_OK=false
          # Edge propagation can return an older successful response or a 5xx.
          # Five bounded requests, at most 180 seconds including backoff.
          for DELAY in 0 2 4 8 16; do
            sleep "$DELAY"
            if HEALTH=$(curl --fail --silent --show-error --max-time 30 "$AIRADIO_BASE/health"); then
              if printf '%s' "$HEALTH" | jq -e --arg sha "$GITHUB_SHA" '.ok == true and .service == "airadio" and .sha == $sha' >/dev/null; then
                READBACK_OK=true
                break
              fi
            fi
          done
          if [ "$READBACK_OK" != true ]; then
            echo "::error::$AIRADIO_BASE/health did not echo deployed SHA $GITHUB_SHA after five bounded attempts"
            exit 1
          fi
          echo "health read-back: sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: disposable preview channel canary
        if: env.TARGET_ENV == 'staging'
        run: node scripts/airadio-mcp-probe.mjs --canary --preview-url "$AIRADIO_BASE" --channel-only

      - name: report the station address
        run: |
          echo "## AI RADIO deployed ($TARGET_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo "workers.dev address: $AIRADIO_BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: attach airadio.akbrd.com when the zone exists
        if: env.TARGET_ENV == 'production'
        run: |
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Read first: an attached domain needs no write, so an ordinary
          # release changes nothing on the zone.
          ATTACHED=$(curl -s -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=airadio.akbrd.com" \
            | jq -r '[.result[]? | select(.hostname == "airadio.akbrd.com" and .service == "airadio")] | length')
          if [ "$ATTACHED" = "1" ]; then
            echo "airadio.akbrd.com is already attached to airadio" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ZONE_ID=$(curl -s -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones?name=akbrd.com" | jq -r '.result[0].id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "zone akbrd.com is not in this account yet — the station stays on workers.dev" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESULT=$(curl -s -X PUT -H "$AUTH" \
            -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -d "{\"zone_id\":\"$ZONE_ID\",\"hostname\":\"airadio.akbrd.com\",\"service\":\"airadio\",\"environment\":\"production\"}")
          if ! printf '%s' "$RESULT" | jq -e '.success == true' >/dev/null; then
            echo "::error::custom domain attach failed"
            exit 1
          fi

  # The same gates as ci.yml, on the exact commit being deployed: a push can
  # reach main without a pull request, and staging must never run red code.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: refuse an unthrottled surface
        run: npm run airadio:gate
      - name: served radio, daemon and icons equal their sources
        run: npm run airadio:sync-daemon
      - name: tests
        run: npm test

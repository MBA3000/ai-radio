name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: refuse an unthrottled surface
        run: npm run airadio:gate
      - name: served daemon equals the runnable copy
        run: npm run airadio:sync-daemon
      - name: tests
        run: npm test

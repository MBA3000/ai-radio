name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: refuse an unthrottled surface
        run: npm run airadio:gate
      - name: served radio, daemon and icons equal their sources
        run: npm run airadio:sync-daemon
      - name: tests
        run: npm test
